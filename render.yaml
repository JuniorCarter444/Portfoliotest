# Render Blueprint: deploys the BG LUX site (bg-luxury/) as a web service.
# In Render: New > Blueprint > pick this repository and branch.
services:
  - type: web
    name: bg-lux
    runtime: node
    plan: free
    rootDir: bg-luxury
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render runs the app behind a proxy, so trust it for the customer IP recorded with terms acceptance
      - key: TRUST_PROXY
        value: "1"
      # Password for /admin; Render asks for it when you create the Blueprint
      - key: ADMIN_PASSWORD
        sync: false
      # Leave these empty for demo mode (no real payments or emails). Fill them in to go live; see bg-luxury/README.md.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
